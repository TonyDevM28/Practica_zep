<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zep + Gemini Chat</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:       #0f1117;
        --surface:  #1a1d27;
        --border:   #2a2d3e;
        --accent:   #6c63ff;
        --accent-h: #574fd6;
        --user-bg:  #6c63ff;
        --bot-bg:   #252838;
        --text:     #e2e8f0;
        --subtext:  #8892a4;
        --danger:   #ff6b6b;
        --radius:   14px;
        --font:     'Segoe UI', system-ui, sans-serif;
      }

      body {
        background: var(--bg); color: var(--text);
        font-family: var(--font);
        display: flex; flex-direction: column;
        align-items: center; min-height: 100vh; padding: 24px 16px;
      }

      header {
        width: 100%; max-width: 760px;
        margin-bottom: 20px;
        display: flex; flex-direction: column; gap: 12px;
      }
      .title-row { display: flex; align-items: center; gap: 12px; }
      .logo {
        width: 40px; height: 40px; background: var(--accent);
        border-radius: 10px; display: grid; place-items: center;
        font-size: 20px; flex-shrink: 0;
      }
      h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.3px; }
      h1 span { color: var(--accent); }

      .thread-row {
        display: flex; align-items: center; gap: 10px;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 10px 14px;
      }
      .thread-row label {
        font-size: 0.78rem; color: var(--subtext); white-space: nowrap;
        font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
      }
      .thread-row input {
        flex: 1; background: transparent; border: none; outline: none;
        color: var(--text); font-family: 'Courier New', monospace; font-size: 0.9rem;
      }
      .thread-row input::placeholder { color: var(--subtext); }
      .status-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #4ade80; flex-shrink: 0; box-shadow: 0 0 6px #4ade80aa;
      }

      #chat-container {
        width: 100%; max-width: 760px; flex: 1;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); display: flex; flex-direction: column;
        overflow: hidden; min-height: 480px; max-height: 60vh;
      }

      #messages {
        flex: 1; overflow-y: auto; padding: 20px;
        display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth;
      }
      #messages::-webkit-scrollbar { width: 5px; }
      #messages::-webkit-scrollbar-track { background: transparent; }
      #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

      .msg { display: flex; flex-direction: column; max-width: 80%; animation: fadeIn 0.2s ease; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .msg.user  { align-self: flex-end;   align-items: flex-end; }
      .msg.bot   { align-self: flex-start; align-items: flex-start; }

      .bubble {
        padding: 11px 16px; border-radius: var(--radius);
        font-size: 0.92rem; line-height: 1.55;
        word-break: break-word; white-space: pre-wrap;
      }
      .msg.user  .bubble { background: var(--user-bg); color: #fff; border-bottom-right-radius: 4px; }
      .msg.bot   .bubble { background: var(--bot-bg); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
      .msg.error .bubble { background: #2d1a1a; color: var(--danger); border: 1px solid #5c2020; }
      .msg-time { font-size: 0.68rem; color: var(--subtext); margin-top: 4px; padding: 0 4px; }

      .typing-indicator {
        display: flex; align-items: center; gap: 5px; padding: 12px 16px;
        background: var(--bot-bg); border: 1px solid var(--border);
        border-radius: var(--radius); border-bottom-left-radius: 4px; width: fit-content;
      }
      .typing-indicator span {
        width: 7px; height: 7px; background: var(--subtext);
        border-radius: 50%; animation: bounce 1.2s infinite ease-in-out;
      }
      .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
      .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30%            { transform: translateY(-6px); }
      }

      .empty-state {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 10px; color: var(--subtext); text-align: center; padding: 40px;
      }
      .empty-state .icon { font-size: 2.5rem; }
      .empty-state p { font-size: 0.9rem; }

      #input-area {
        display: flex; align-items: flex-end; gap: 10px;
        padding: 14px 16px; border-top: 1px solid var(--border);
        background: var(--surface);
      }
      #user-input {
        flex: 1; background: var(--bg); border: 1px solid var(--border);
        border-radius: 10px; color: var(--text); font-family: var(--font);
        font-size: 0.92rem; padding: 10px 14px; resize: none; outline: none;
        min-height: 44px; max-height: 140px; transition: border-color 0.2s; line-height: 1.5;
      }
      #user-input:focus { border-color: var(--accent); }
      #user-input::placeholder { color: var(--subtext); }

      #send-btn {
        background: var(--accent); border: none; border-radius: 10px;
        color: #fff; width: 44px; height: 44px; cursor: pointer;
        display: grid; place-items: center;
        transition: background 0.2s, transform 0.1s; flex-shrink: 0;
      }
      #send-btn:hover:not(:disabled) { background: var(--accent-h); }
      #send-btn:active:not(:disabled) { transform: scale(0.95); }
      #send-btn:disabled { background: var(--border); cursor: not-allowed; }
      #send-btn svg { pointer-events: none; }
    </style>
  </head>

  <body>
    <header>
      <div class="title-row">
        <div class="logo">🤖</div>
        <div>
          <h1>Zep + <span>Gemini</span> Chat</h1>
        </div>
      </div>
      <div class="thread-row">
        <label>Thread ID</label>
        <input id="thread-id" type="text" value="hilo_practica_01"
               placeholder="Nombre del hilo de memoria..." spellcheck="false" />
        <div class="status-dot" title="Conectado"></div>
      </div>
    </header>

    <div id="chat-container">
      <div id="messages">
        <div class="empty-state" id="empty-state">
          <div class="icon">💬</div>
          <p>Escribe un mensaje para comenzar.<br/>Zep recordará el contexto de esta sesión.</p>
        </div>
      </div>
      <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="Escribe tu mensaje…" autofocus></textarea>
        <button id="send-btn" title="Enviar (Enter)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById('messages');
      const inputEl    = document.getElementById('user-input');
      const sendBtn    = document.getElementById('send-btn');
      const threadIdEl = document.getElementById('thread-id');
      const emptyState = document.getElementById('empty-state');

      // Auto-resize textarea
      inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
      });

      // Enter = enviar | Shift+Enter = salto de línea
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });

      sendBtn.addEventListener('click', sendMessage);

      function getTime() {
        return new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      }

      function appendMessage(role, text) {
        if (emptyState) emptyState.style.display = 'none';

        const wrapper = document.createElement('div');
        wrapper.className = `msg ${role}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        const time = document.createElement('span');
        time.className = 'msg-time';
        time.textContent = getTime();

        wrapper.appendChild(bubble);
        wrapper.appendChild(time);
        messagesEl.appendChild(wrapper);
        scrollToBottom();
        return wrapper;
      }

      function showTyping() {
        const wrapper = document.createElement('div');
        wrapper.className = 'msg bot';
        wrapper.id = 'typing';
        wrapper.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
        messagesEl.appendChild(wrapper);
        scrollToBottom();
      }

      function hideTyping() {
        const t = document.getElementById('typing');
        if (t) t.remove();
      }

      function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

      async function sendMessage() {
        const mensaje  = inputEl.value.trim();
        const threadId = threadIdEl.value.trim() || 'hilo_practica_01';
        if (!mensaje) return;

        appendMessage('user', mensaje);
        inputEl.value = '';
        inputEl.style.height = 'auto';
        sendBtn.disabled = true;
        inputEl.disabled = true;
        showTyping();

        try {
          const res  = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mensaje, threadId }),
          });
          const data = await res.json();
          hideTyping();
          if (!res.ok) {
            appendMessage('error', '⚠️ Error: ' + (data.error || 'Sin respuesta del servidor.'));
          } else {
            appendMessage('bot', data.respuesta);
          }
        } catch (err) {
          hideTyping();
          appendMessage('error', '⚠️ No se pudo conectar con el servidor. ¿Está corriendo?');
        } finally {
          sendBtn.disabled = false;
          inputEl.disabled = false;
          inputEl.focus();
        }
      }
    </script>
  </body>
</html>
